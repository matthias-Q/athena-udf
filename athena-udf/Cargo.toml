[package]
name = "athena-udf"
version = "0.3.0"
edition = "2021"
authors = ["Matthias Queitsch <matthias.queitsch@unite.eu>"]
description = "A crate for building AWS Athena User Defined Functions in Rust"
license = "MIT"
keywords = ["athena", "aws", "udf", "lambda", "arrow"]
categories = ["database"]
rust-version = "1.88"
homepage = "https://github.com/matthias-Q/athena-udf"
repository = "https://github.com/matthias-Q/athena-udf"
readme = "../README.md"

[dependencies]
lambda_runtime = "1.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = { version = "60", features = ["ipc"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
