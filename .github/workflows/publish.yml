name: Publish to crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the crate version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "athena-udf") | .version')
          tag="${TAG_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '${TAG_NAME}' does not match the athena-udf version '${version}'."
            echo "Run 'just publish' to bump the version, or delete and re-create the tag."
            exit 1
          fi
          echo "Tag '${TAG_NAME}' matches athena-udf ${version}."
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists, keeping it."
          else
            gh release create "$TAG_NAME" --verify-tag --generate-notes
          fi
      - name: Publish to crates.io
        run: cargo publish -p athena-udf --token ${{ secrets.CRATES_IO_TOKEN }}
